<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuración · AgroIA</title>
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<aside id="sidebar"></aside>
<main>
  <h1 class="pag-titulo">Configuración del sistema</h1>
  <div class="cfg-col">
    <section class="cfg-card">
      <div class="cfg-cab">Conexión a ThingSpeak</div>
      <div class="cfg-cuerpo">
        <div class="cfg-fila"><div class="estado-txt">Estado: <span id="ts-estado">Verificando...</span></div><button class="btn-p" id="ts-config">Configurar</button></div>
        <p class="cfg-nota" id="ts-detalle"></p>
      </div>
    </section>
    <section class="cfg-card">
      <div class="cfg-cab">Notificaciones</div>
      <div class="cfg-cuerpo">
        <div class="cfg-fila"><span>Recibir alertas</span><label class="switch"><input type="checkbox" id="n-act" aria-label="Recibir alertas"><i></i></label></div>
        <div class="campo" style="margin-top:14px"><label for="n-mail">Correo de notificación</label><input class="inp" id="n-mail" type="email" placeholder="tu@ejemplo.com" autocomplete="email"></div>
        <div class="cfg-acciones"><button class="btn-p" id="n-guardar">Guardar</button></div>
        <p class="cfg-nota">Esta preferencia se guarda en este navegador. El envío de correos necesita el servidor.</p>
      </div>
    </section>
    <section class="cfg-card">
      <div class="cfg-cab">Preferencias</div>
      <div class="cfg-cuerpo">
        <div class="cfg-2col">
          <div class="campo"><label for="pf-tema">Tema</label><select class="inp" id="pf-tema"><option value="claro">Claro</option><option value="oscuro" disabled>Oscuro (próximamente)</option></select></div>
          <div class="campo"><label for="pf-idioma">Idioma</label><select class="inp" id="pf-idioma"><option value="es">Español</option><option value="en" disabled>English (próximamente)</option></select></div>
        </div>
        <div class="cfg-acciones"><button class="btn-p" id="pf-guardar">Guardar</button></div>
      </div>
    </section>
    <section class="cfg-card">
      <div class="cfg-cab">Información</div>
      <div class="cfg-cuerpo"><dl class="det-lista" id="info"></dl></div>
    </section>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/iconos.js"></script>
<script src="../js/ts.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/configuracion.js"></script>
</body>
</html>
