<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predicción de fertilidad · AgroIA</title>
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<aside id="sidebar"></aside>
<main class="apilado">
  <h1 class="pag-titulo">Análisis de fertilidad del suelo</h1>
  <div class="pred-grid">
    <section class="panel">
      <h3>Datos del análisis</h3>
      <div class="campo"><label for="p-temp">Temperatura del aire</label><div class="campo-unidad"><input class="inp" id="p-temp" type="number" step="0.1" inputmode="decimal"><span class="unidad">°C</span></div></div>
      <div class="campo"><label for="p-humAire">Humedad del aire</label><div class="campo-unidad"><input class="inp" id="p-humAire" type="number" step="1" inputmode="decimal"><span class="unidad">%</span></div></div>
      <div class="campo"><label for="p-humSuelo">Humedad del suelo</label><div class="campo-unidad"><input class="inp" id="p-humSuelo" type="number" step="1" inputmode="decimal"><span class="unidad">%</span></div></div>
      <div class="campo"><label for="p-ph">pH del suelo</label><input class="inp" id="p-ph" type="number" step="0.1" inputmode="decimal"></div>
      <button class="btn-p ancho" id="analizar">Analizar</button>
      <button class="btn-s ancho" id="ultima" style="margin-top:10px"></button>
      <p class="cfg-nota" id="origen-datos"></p>
    </section>
    <section class="panel" id="resultado"></section>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/iconos.js"></script>
<script src="../js/ts.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/prediccion.js"></script>
</body>
</html>
